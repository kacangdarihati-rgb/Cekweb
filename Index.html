<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Gta Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e2a38 0%, #0d1117 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-top: 0; color: #00ff88; }
        .info-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 0.9rem;
            text-align: left;
            border-left: 4px solid #00ff88;
        }
        .info-item { margin: 5px 0; }
        .label { color: #aaa; font-size: 0.8rem; }
        .value { font-family: 'Courier New', Courier, monospace; color: #fff; }
        
        button {
            background: #25D366;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        button:hover {
            background: #1da851;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }
        button:disabled { background: #555; cursor: not-allowed; }
        .loading-text { font-style: italic; color: #00ff88; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pembacaan Data Untuk Register Tool</h2>
    <p style="color: #ccc;">Sistem akan mendeteksi IP Hp Kalian.</p>
    
    <div class="info-box" id="loader">
        <p class="loading-text">Sedang melacak data perangkat...</p>
    </div>

    <div class="info-box" id="data-display" style="display: none;">
        <div class="info-item"><span class="label">USER CODE:</span> <br><span class="value" id="u-code"></span></div>
        <div class="info-item"><span class="label">IP ADDRESS:</span> <br><span class="value" id="u-ip"></span></div>
        <div class="info-item"><span class="label">LOKASI:</span> <br><span class="value" id="u-loc"></span></div>
        <div class="info-item"><span class="label">PROVIDER:</span> <br><span class="value" id="u-isp"></span></div>
    </div>

    <button id="btn-wa" onclick="sendToWhatsApp()" disabled>
        Kirim Ke Admin
    </button>
</div>

<script>
    let userData = {
        ip: "",
        city: "",
        region: "",
        isp: "",
        code: "ID-" + Math.floor(Math.random() * 899999 + 100000)
    };

    async function getFullData() {
        try {
            const response = await fetch('http://ip-api.com/json/?fields=status,message,country,regionName,city,isp,query');
            const data = await response.json();

            if(data.status === "success") {
                userData.ip = data.query;
                userData.city = data.city;
                userData.region = data.regionName;
                userData.isp = data.isp;

                document.getElementById('u-code').innerText = userData.code;
                document.getElementById('u-ip').innerText = userData.ip;
                document.getElementById('u-loc').innerText = `${userData.city}, ${userData.region}`;
                document.getElementById('u-isp').innerText = userData.isp;

                document.getElementById('loader').style.display = "none";
                document.getElementById('data-display').style.display = "block";
                document.getElementById('btn-wa').disabled = false;
            }
        } catch (error) {
            document.getElementById('loader').innerHTML = "<span style='color:red'>Gagal melacak data. Periksa koneksi internet.</span>";
        }
    }

    function sendToWhatsApp() {
        const adminNumber = "6282234691398";
        
        const text = `*LAPORAN AKSES USER*%0A` +
                     `--------------------------%0A` +
                     `*Code:* ${userData.code}%0A` +
                     `*IP:* ${userData.ip}%0A` +
                     `*Lokasi:* ${userData.city}, ${userData.region}%0A` +
                     `*Provider:* ${userData.isp}%0A` +
                     `*Waktu:* ${new Date().toLocaleString('id-ID')}%0A` +
                     `--------------------------`;

        window.open(`https://wa.me/${adminNumber}?text=${text}`, '_blank');
    }

    getFullData();
</script>

</body>
</html>
